name: Build and Push Docker Image

on:
    push:
        branches: ["**"]
    pull_request:

permissions:
    contents: read

concurrency:
    group: docker-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    security:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "24"
                  package-manager-cache: false

            - name: Enable pinned pnpm
              run: |
                  corepack enable
                  corepack install

            - name: Install locked dependencies
              run: pnpm install --frozen-lockfile

            - name: Audit dependencies
              run: pnpm audit --audit-level=low

            - name: Lint
              run: pnpm lint

            - name: Check types
              run: pnpm typecheck

            - name: Run security tests
              run: pnpm test:security

    docker:
        needs: security
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up QEMU (for multi-arch)
              uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

            - name: Log in to Docker Hub
              if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build and publish from the default branch
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: .
                  file: Dockerfile
                  push: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
                  tags: |
                      pawanosman/charplay:latest
                      pawanosman/charplay:${{ github.sha }}
                  platforms: linux/amd64,linux/arm64
                  pull: true
                  provenance: mode=max
                  sbom: true
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
